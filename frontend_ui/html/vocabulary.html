<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>词汇记忆 - 轻量化智能学情管理系统</title>
    <link rel="stylesheet" href="../css/common.css">
</head>
<body>
    <div class="app-layout">
        <!-- 侧边导航栏 -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <h1>智能备考系统</h1>
            </div>
            <nav class="sidebar-menu">
                <a href="vocabulary.html" class="sidebar-menu-item active">
                    <span class="icon">📚</span>
                    <span>词汇记忆</span>
                </a>
                <a href="mistakes.html" class="sidebar-menu-item">
                    <span class="icon">📝</span>
                    <span>错题归档</span>
                </a>
                <a href="quiz.html" class="sidebar-menu-item">
                    <span class="icon">✏️</span>
                    <span>专项题库</span>
                </a>
                <a href="review.html" class="sidebar-menu-item">
                    <span class="icon">🔄</span>
                    <span>记忆复习</span>
                </a>
                <a href="analytics.html" class="sidebar-menu-item">
                    <span class="icon">📊</span>
                    <span>学情分析</span>
                </a>
                <a href="ai.html" class="sidebar-menu-item">
                    <span class="icon">🤖</span>
                    <span>AI备考</span>
                </a>
                <a href="plan.html" class="sidebar-menu-item">
                    <span class="icon">📅</span>
                    <span>备考计划</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                v1.0.0 · 3号前端
            </div>
        </aside>

        <!-- 主内容区 -->
        <div class="main-content">
            <!-- 顶部状态栏 -->
            <header class="header">
                <div class="header-left">
                    <h2 class="header-title">词汇记忆</h2>
                </div>
                <div class="header-right">
                    <div class="header-status">
                        <span class="status-dot"></span>
                        <span>离线模式</span>
                    </div>
                    <div class="header-user">
                        <div class="user-avatar">学</div>
                        <span class="user-name">学习者</span>
                    </div>
                </div>
            </header>

            <!-- 页面内容区 -->
            <main class="page-content">
                <!-- 页面标题 -->
                <div class="page-header">
                    <h1 class="page-title">词汇记忆</h1>
                    <p class="page-subtitle">选择词库，开始今天的单词学习</p>
                </div>

                <!-- 筛选栏 -->
                <div class="filter-bar">
                    <div class="filter-item">
                        <label class="filter-label">科目：</label>
                        <select class="filter-select">
                            <option>考研英语</option>
                            <option>英语四级</option>
                            <option>英语六级</option>
                            <option>考研政治</option>
                        </select>
                    </div>
                    <div class="filter-item">
                        <label class="filter-label">词库：</label>
                        <select class="filter-select">
                            <option>核心词汇</option>
                            <option>高频词汇</option>
                            <option>易错词汇</option>
                            <option>全部词汇</option>
                        </select>
                    </div>
                    <div class="filter-item">
                        <label class="filter-label">每日目标：</label>
                        <select class="filter-select">
                            <option>20个</option>
                            <option>30个</option>
                            <option>50个</option>
                            <option>100个</option>
                        </select>
                    </div>
                    <div style="flex: 1;"></div>
                    <button class="btn btn-primary btn-sm">开始学习</button>
                </div>

                <!-- 学习进度卡片 -->
                <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px;">
                    <div class="card">
                        <div style="font-size: 13px; color: var(--color-text-caption); margin-bottom: 8px;">今日已学</div>
                        <div style="font-size: 28px; font-weight: 700; color: var(--color-primary-light);">12</div>
                        <div style="font-size: 12px; color: var(--color-text-caption); margin-top: 4px;">/ 20个</div>
                    </div>
                    <div class="card">
                        <div style="font-size: 13px; color: var(--color-text-caption); margin-bottom: 8px;">认识</div>
                        <div style="font-size: 28px; font-weight: 700; color: var(--color-success);">8</div>
                        <div style="font-size: 12px; color: var(--color-text-caption); margin-top: 4px;">正确率 67%</div>
                    </div>
                    <div class="card">
                        <div style="font-size: 13px; color: var(--color-text-caption); margin-bottom: 8px;">不认识</div>
                        <div style="font-size: 28px; font-weight: 700; color: var(--color-danger);">4</div>
                        <div style="font-size: 12px; color: var(--color-text-caption); margin-top: 4px;">加入错题本</div>
                    </div>
                    <div class="card">
                        <div style="font-size: 13px; color: var(--color-text-caption); margin-bottom: 8px;">学习时长</div>
                        <div style="font-size: 28px; font-weight: 700; color: var(--color-warning);">15</div>
                        <div style="font-size: 12px; color: var(--color-text-caption); margin-top: 4px;">分钟</div>
                    </div>
                </div>

                <!-- 单词卡片区域 -->
                <div class="card" style="max-width: 600px; margin: 0 auto; text-align: center; padding: 40px;">
                    <div style="margin-bottom: 16px;">
                        <span class="tag tag-primary">第 13 / 20 个</span>
                    </div>
                    <div style="font-size: 42px; font-weight: 700; color: var(--color-text-title); margin-bottom: 12px; letter-spacing: 2px;">
                        vocabulary
                    </div>
                    <div style="font-size: 16px; color: var(--color-text-secondary); margin-bottom: 8px;">
                        /vəˈkæbjələri/
                    </div>
                    <div style="font-size: 14px; color: var(--color-text-caption); margin-bottom: 24px;">
                        n. 词汇；词汇量
                    </div>
                    <div style="background-color: var(--color-bg-card); border-radius: var(--radius-card); padding: 16px; margin-bottom: 24px; text-align: left;">
                        <div style="font-size: 13px; color: var(--color-text-caption); margin-bottom: 8px;">例句：</div>
                        <div style="font-size: 14px; color: var(--color-text-body); line-height: 1.6;">
                            She has a large vocabulary in English.<br>
                            她的英语词汇量很大。
                        </div>
                    </div>
                    <div style="display: flex; gap: 16px; justify-content: center;">
                        <button class="btn btn-danger btn-lg" style="flex: 1;">不认识</button>
                        <button class="btn btn-success btn-lg" style="flex: 1;">认识</button>
                    </div>
                </div>

                <!-- 底部操作栏 -->
                <div style="display: flex; justify-content: center; gap: 12px; margin-top: 24px;">
                    <button class="btn btn-default btn-sm">上一个</button>
                    <button class="btn btn-default btn-sm">显示释义</button>
                    <button class="btn btn-default btn-sm">下一个</button>
                    <button class="btn btn-ghost btn-sm">结束学习</button>
                </div>
            </main>

            <!-- 底部状态栏 -->
            <footer class="footer">
                <div class="footer-left">
                    <span>© 2026 轻量化智能学情管理系统</span>
                </div>
                <div class="footer-right">
                    <span>离线模式</span>
                    <span>v1.0.0</span>
                </div>
            </footer>
        </div>
    </div>
</body>
</html>
